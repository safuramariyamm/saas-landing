name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |
            cd ~/saas-landing

            git pull origin main

            sudo docker stop saas-landing-container || true
            sudo docker rm saas-landing-container || true

            sudo docker build -t saas-landing .

            sudo docker run -d \
              -p 3004:3000 \
              --name saas-landing-container \
              --restart unless-stopped \
              saas-landing

            sudo systemctl restart nginx